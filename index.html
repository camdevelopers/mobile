<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAN Finder v4</title>
<!-- <link rel="manifest" href='data:application/json,{"name":"LAN Finder","short_name":"LANFinder","start_url":".","display":"standalone","background_color":"#1a1a2e","theme_color":"#1a1a2e"}'> -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui; background: #1a1a2e; color: #eee; padding: 2rem; min-height: 100vh; }
  h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
  .row { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input { flex: 1; padding: .6rem; border-radius: 6px; border: 1px solid #444; background: #222; color: #eee; font-size: 1rem; }
  button { padding: .6rem 1.2rem; border: none; border-radius: 6px; background: #4f46e5; color: #fff; font-size: 1rem; cursor: pointer; }
  button:hover { background: #6366f1; }
  #status { margin-top: 1rem; font-size: .9rem; color: #999; }
  #result { margin-top: 1rem; font-size: 1.1rem; }
  .found { color: #34d399; }
  .not-found { color: #f87171; }
</style>
</head>
<body>
<h1>LAN Server Discovery</h1>

<div class="row">
  <input id="subnet" type="text" placeholder="e.g. 192.168.1" />
  <button id="save">Save</button>
  <button id="change">Change</button>
</div>
<div class="row">
  <input id="port" type="number" placeholder="3000" style="max-width:100px" />
  <button id="scan">Scan</button>
</div>

<div id="status"></div>
<div id="result"></div>
<div id="log" style="margin-top:1rem;max-height:300px;overflow-y:auto;font-size:.8rem;font-family:monospace;background:#111;padding:.8rem;border-radius:6px;"></div>   
<script>
const $subnet = document.getElementById('subnet');
const $port = document.getElementById('port');
const $status = document.getElementById('status');
const $result = document.getElementById('result');
const $log = document.getElementById('log');

$subnet.value = localStorage.getItem('subnet') || '';
$port.value = localStorage.getItem('port') || '3000';

document.getElementById('save').onclick = () => {
  localStorage.setItem('subnet', $subnet.value.trim());
  $status.textContent = 'Saved.';
};

document.getElementById('change').onclick = () => {
  $subnet.value = '';
  $subnet.focus();
  $status.textContent = 'Enter new subnet.';
};

document.getElementById('scan').onclick = async () => {
  const subnet = $subnet.value.trim();
  const port = $port.value || '3000';
  if (!subnet) { $status.textContent = 'Enter a subnet first.'; return; }

  localStorage.setItem('subnet', subnet);
  localStorage.setItem('port', port);

  $result.textContent = '';
  $log.innerHTML = '';
  $status.textContent = 'Scanning…';

  const found = await discover(subnet, port);

  if (found) {
    $result.innerHTML = `<span class="found">Found: ${found}:${port}</span>`;
    localStorage.setItem('server', `${found}:${port}`);
  } else {
    $result.innerHTML = `<span class="not-found">No server found on ${subnet}.0/24</span>`;
  }
  $status.textContent = 'Done.';
};

function logLine(ip, detail, cls) {
  const div = document.createElement('div');
  div.textContent = `${ip} → ${detail}`;
  if (cls) div.style.color = cls;
  $log.appendChild(div);
  $log.scrollTop = $log.scrollHeight;
}

async function discover(subnet, port) {
  const batchSize = 50;
  for (let i = 1; i <= 254; i += batchSize) {
    const ips = Array.from({ length: Math.min(batchSize, 254 - i + 1) }, (_, j) => `${subnet}.${i + j}`);

    const results = await Promise.allSettled(
      ips.map(ip =>
        fetch(`http://${ip}:${port}/hello`, {
          targetAddressSpace: 'local',
          signal: AbortSignal.timeout(600),
        }).then(r => ({ status: r.status, text: r.text() }))
      )
    );

    for (let j = 0; j < results.length; j++) {
      const ip = ips[j];
      const r = results[j];
      if (r.status === 'fulfilled') {
        const body = await r.value.text;
        logLine(ip, `200 "${body.trim()}"`, body.trim() === 'yes' ? '#34d399' : '#fbbf24');
        if (body.trim() === 'yes') return ip;
      } else {
        const err = r.reason?.name === 'TimeoutError' ? 'timeout' : (r.reason?.message || 'error');
        logLine(ip, err, '#666');
      }
    }
    $status.textContent = `Scanned ${Math.min(i + batchSize - 1, 254)}/254…`;
  }
  return null;
}

async function ping(ip, port) {
  const el = document.createElement('div');
  el.style.cssText = 'font-family:monospace;font-size:.85rem;margin:.3rem 0;';
  document.body.appendChild(el);

  const t0 = performance.now();
  el.textContent = `${ip}:${port} …`;

  try {
    const res = await fetch(`http://${ip}:${port}/hello`, {
      targetAddressSpace: 'local',
      signal: AbortSignal.timeout(3000),
    });
    const ms = Math.round(performance.now() - t0);
    const body = await res.text();
    el.textContent = `${ip}:${port} → ${res.status} "${body}" in ${ms}ms`;
    el.style.color = res.status === 200 ? '#34d399' : '#fbbf24';
  } catch (e) {
    const ms = Math.round(performance.now() - t0);
    el.textContent = `${ip}:${port} → ${e.name} after ${ms}ms`;
    el.style.color = '#f87171';
  }
}

// Test
(async () => {
  await ping('192.168.1.42', 3000);
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}   
</script>
</body>
</html>
